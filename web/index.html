<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ning</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin:0; font-family: -apple-system, "PingFang SC", sans-serif; background:#f2f2f7; color:#000; }
.hide { display:none !important; }
.page { display:flex; flex-direction:column; height:100vh; height:100dvh; }

/* 登录页 */
#login { justify-content:center; align-items:center; padding:20px; }
#login h1 { font-size:28px; margin:0 0 30px; }
#login input { width:100%; max-width:320px; padding:14px; font-size:16px; border:1px solid #ddd; border-radius:10px; margin-bottom:12px; }
#login button { width:100%; max-width:320px; padding:14px; font-size:16px; border:none; border-radius:10px; background:#007aff; color:#fff; font-weight:600; }

/* 顶部 */
.topbar { background:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e5e5ea; }
.topbar .name { font-weight:600; }
.topbar .status { font-size:12px; color:#8e8e93; }

/* 主页面 */
#home { padding:0; }
.tabs { display:flex; background:#fff; border-bottom:1px solid #e5e5ea; }
.tab { flex:1; text-align:center; padding:12px; font-size:15px; color:#8e8e93; }
.tab.active { color:#007aff; font-weight:600; border-bottom:2px solid #007aff; }
.tab-content { flex:1; overflow-y:auto; padding:12px; }

/* 用户列表 */
.user-item { background:#fff; padding:14px; border-radius:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
.user-item .uname { font-weight:600; }
.user-item .meta { font-size:12px; color:#8e8e93; margin-top:4px; }
.user-item .battery { font-size:13px; color:#34c759; }
.user-item .battery.low { color:#ff3b30; }
.user-item .battery.charging { color:#007aff; }

/* 我的状态 */
#mestatus { background:#fff; padding:16px; border-radius:12px; }
#mestatus .row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #f0f0f0; font-size:15px; }
#mestatus .row:last-child { border:none; }

/* 聊天 */
#chat { padding:0; background:#f2f2f7; }
#chat .chat-top { background:#fff; padding:12px 16px; display:flex; align-items:center; border-bottom:1px solid #e5e5ea; }
#chat .back { color:#007aff; font-size:16px; margin-right:12px; cursor:pointer; }
#chat .chat-name { font-weight:600; }
#chat .msgs { flex:1; overflow-y:auto; padding:12px; }
.msg { max-width:75%; padding:9px 13px; border-radius:18px; margin-bottom:8px; word-break:break-word; font-size:15px; line-height:1.4; }
.msg.me { background:#007aff; color:#fff; margin-left:auto; border-bottom-right-radius:5px; }
.msg.you { background:#fff; margin-right:auto; border-bottom-left-radius:5px; }
.msg img { max-width:100%; border-radius:12px; display:block; }
.msg .time { font-size:11px; opacity:0.6; margin-top:4px; }
.chat-input { background:#fff; padding:8px; display:flex; gap:8px; align-items:center; border-top:1px solid #e5e5ea; }
.chat-input input[type=text] { flex:1; padding:10px 14px; border:1px solid #e5e5ea; border-radius:20px; font-size:15px; }
.chat-input .icon-btn { width:40px; height:40px; border-radius:50%; background:#007aff; color:#fff; border:none; font-size:18px; display:flex; align-items:center; justify-content:center; }
.chat-input .img-btn { background:#8e8e93; }

.toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); color:#fff; padding:10px 18px; border-radius:20px; font-size:14px; z-index:999; }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="login" class="page">
  <h1>Ning</h1>
  <input id="nameInput" placeholder="输入你的名字" maxlength="20">
  <button onclick="doLogin()">进入</button>
</div>

<!-- 主页 -->
<div id="home" class="page hide">
  <div class="topbar">
    <div>
      <div class="name" id="myName">-</div>
      <div class="status" id="connStatus">连接中…</div>
    </div>
    <button onclick="logout()" style="background:none;border:none;color:#ff3b30;font-size:15px;">退出</button>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('users')">好友</div>
    <div class="tab" onclick="switchTab('me')">我的状态</div>
  </div>
  <div id="users" class="tab-content"></div>
  <div id="me" class="tab-content hide">
    <div id="mestatus"></div>
  </div>
</div>

<!-- 聊天页 -->
<div id="chat" class="page hide">
  <div class="chat-top">
    <div class="back" onclick="closeChat()">← 返回</div>
    <div class="chat-name" id="chatName">-</div>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="chat-input">
    <button class="icon-btn img-btn" onclick="document.getElementById('fileInput').click()">+</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="sendImage(this)">
    <input type="text" id="msgInput" placeholder="说点什么…" onkeydown="if(event.key==='Enter')sendText()">
    <button class="icon-btn" onclick="sendText()">↑</button>
  </div>
</div>

<script>
const API = location.origin;
let token = localStorage.getItem('token') || '';
let me = JSON.parse(localStorage.getItem('me') || 'null');
let socket = null;
let currentPeer = null;
let allUsers = [];
let myStatus = {};

// ============ 启动 ============
window.onload = () => {
  if (token && me) {
    enterApp();
  }
};

// ============ 登录 ============
async function doLogin() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return toast('请输入名字');
  const deviceId = localStorage.getItem('deviceId') || genDeviceId();
  localStorage.setItem('deviceId', deviceId);

  const r = await fetch(API + '/api/auth', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ deviceId, name })
  });
  const d = await r.json();
  if (!d.token) return toast('登录失败');
  token = d.token;
  me = { id: d.userId, name: d.name };
  localStorage.setItem('token', token);
  localStorage.setItem('me', JSON.stringify(me));
  enterApp();
}

function genDeviceId() {
  return 'dev-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function logout() {
  if (socket) socket.disconnect();
  localStorage.removeItem('token');
  localStorage.removeItem('me');
  location.reload();
}

// ============ 进入主界面 ============
function enterApp() {
  document.getElementById('login').classList.add('hide');
  document.getElementById('home').classList.remove('hide');
  document.getElementById('myName').textContent = me.name;
  connectSocket();
  loadUsers();
  startStatusReport();
}

// ============ WebSocket ============
function connectSocket() {
  socket = io(API, { auth: { token }, transports: ['websocket', 'polling'] });
  socket.on('connect', () => {
    document.getElementById('connStatus').textContent = '在线';
    document.getElementById('connStatus').style.color = '#34c759';
  });
  socket.on('disconnect', () => {
    document.getElementById('connStatus').textContent = '离线';
    document.getElementById('connStatus').style.color = '#ff3b30';
  });
  socket.on('message', (m) => {
    if (currentPeer && (m.fromId === currentPeer.id || m.toId === currentPeer.id)) {
      appendMsg(m);
    }
  });
  socket.on('status', (s) => {
    const u = allUsers.find(x => x.id === s.userId);
    if (u) { u.battery = s.battery; u.charging = s.charging; u.lat = s.lat; u.lng = s.lng; u.updatedAt = s.updatedAt; renderUsers(); }
    if (s.userId === me.id) { myStatus = s; renderMyStatus(); }
  });
}

// ============ 用户列表 ============
async function loadUsers() {
  const r = await fetch(API + '/api/users', { headers: { 'Authorization': 'Bearer ' + token } });
  allUsers = (await r.json()).filter(u => u.id !== me.id);
  for (const u of allUsers) {
    const sr = await fetch(API + '/api/status/' + u.id, { headers: { 'Authorization': 'Bearer ' + token } });
    const s = await sr.json();
    if (s) { u.battery = s.battery; u.charging = s.charging; u.lat = s.lat; u.lng = s.lng; u.updatedAt = s.updated_at; }
  }
  renderUsers();
}

function renderUsers() {
  const el = document.getElementById('users');
  if (allUsers.length === 0) { el.innerHTML = '<div style="text-align:center;color:#8e8e93;padding:40px;">还没有其他用户<br><br>让对方也打开这个网址注册一下</div>'; return; }
  el.innerHTML = allUsers.map(u => {
    let bat = '电量未知';
    let cls = '';
    if (u.battery != null) {
      bat = (u.charging ? '⚡ ' : '') + u.battery + '%';
      cls = u.charging ? 'charging' : (u.battery < 20 ? 'low' : '');
    }
    let loc = '';
    if (u.lat && u.lng) loc = '📍 位置已更新';
    let time = u.updatedAt ? new Date(u.updatedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '从未更新';
    return `<div class="user-item" onclick="openChat(${u.id})">
      <div>
        <div class="uname">${escapeHtml(u.name)}</div>
        <div class="meta">${loc} · ${time}</div>
      </div>
      <div class="battery ${cls}">${bat}</div>
    </div>`;
  }).join('');
}

function renderMyStatus() {
  const el = document.getElementById('mestatus');
  const rows = [
    ['名字', me.name],
    ['电量', myStatus.battery != null ? myStatus.battery + '%' + (myStatus.charging ? ' (充电中)' : '') : '获取中…'],
    ['位置', myStatus.lat ? `${myStatus.lat.toFixed(4)}, ${myStatus.lng.toFixed(4)}` : '未获取'],
    ['更新时间', myStatus.updatedAt ? new Date(myStatus.updatedAt).toLocaleTimeString('zh-CN') : '-']
  ];
  el.innerHTML = rows.map(r => `<div class="row"><span>${r[0]}</span><span style="color:#8e8e93;">${r[1]}</span></div>`).join('');
}

// ============ 状态上报 ============
async function startStatusReport() {
  async function report() {
    let battery = null, charging = null;
    try {
      if (navigator.getBattery) {
        const b = await navigator.getBattery();
        battery = Math.round(b.level * 100);
        charging = b.charging;
      }
    } catch(e) {}
    let lat = null, lng = null;
    try {
      const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 8000 }));
      lat = pos.coords.latitude;
      lng = pos.coords.longitude;
    } catch(e) {}
    if (battery == null && lat == null) return;
    await fetch(API + '/api/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ battery, charging, lat, lng })
    });
  }
  report();
  setInterval(report, 60000); // 每分钟上报
}

// ============ 聊天 ============
async function openChat(peerId) {
  currentPeer = allUsers.find(u => u.id === peerId);
  document.getElementById('chatName').textContent = currentPeer.name;
  document.getElementById('home').classList.add('hide');
  document.getElementById('chat').classList.remove('hide');
  document.getElementById('msgs').innerHTML = '';
  const r = await fetch(API + '/api/messages/' + peerId, { headers: { 'Authorization': 'Bearer ' + token } });
  const msgs = await r.json();
  msgs.forEach(appendMsg);
  scrollMsgs();
}

function closeChat() {
  currentPeer = null;
  document.getElementById('chat').classList.add('hide');
  document.getElementById('home').classList.remove('hide');
}

function appendMsg(m) {
  const isMe = m.fromId === me.id;
  const el = document.createElement('div');
  el.className = 'msg ' + (isMe ? 'me' : 'you');
  if (m.type === 'image') {
    el.innerHTML = `<img src="${m.content}"><div class="time">${fmtTime(m.createdAt)}</div>`;
  } else {
    el.innerHTML = `${escapeHtml(m.content)}<div class="time">${fmtTime(m.createdAt)}</div>`;
  }
  document.getElementById('msgs').appendChild(el);
  scrollMsgs();
}

function scrollMsgs() {
  const el = document.getElementById('msgs');
  el.scrollTop = el.scrollHeight;
}

function sendText() {
  const inp = document.getElementById('msgInput');
  const txt = inp.value.trim();
  if (!txt || !currentPeer) return;
  socket.emit('message', { toId: currentPeer.id, type: 'text', content: txt });
  inp.value = '';
}

async function sendImage(input) {
  const f = input.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const r = await fetch(API + '/api/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ data: reader.result })
    });
    const d = await r.json();
    if (d.url) {
      socket.emit('message', { toId: currentPeer.id, type: 'image', content: d.url });
    }
    input.value = '';
  };
  reader.readAsDataURL(f);
}

// ============ 工具 ============
function switchTab(t) {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('users').classList.toggle('hide', t !== 'users');
  document.getElementById('me').classList.toggle('hide', t !== 'me');
  if (t === 'me') renderMyStatus();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}
</script>
<script src="/socket.io/socket.io.js"></script>
</body>
</html>
